name: Publish pinned patched CPA
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify pinned inputs
        run: node --test tests/unit/patched_image_contract.cjs
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Test, build and publish
        run: bash scripts/build-patched-cpa.sh --push "$RUNNER_TEMP/patched-image-build.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-image-build
          path: ${{ runner.temp }}/patched-image-build.json
          if-no-files-found: error
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
